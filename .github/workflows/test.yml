name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Bun ${{ matrix.bun-version }} / Wrangler ${{ matrix.wrangler-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version:
          - "1.3.14"
          - canary
        wrangler-version:
          - "4.104.0"
          - "4.110.0"
          - latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install
      - run: bun add --dev --no-save --exact wrangler@${{ matrix.wrangler-version }}
      - run: bun run check
      - run: bun run test
